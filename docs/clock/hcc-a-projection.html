<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>HCC-A systems manifest projection</title>
<style>
:root{--bg:#07080c;--ink:#e8eef8;--dim:#8b97b0;--line:#2a3348;--h:#e8b86d;--x:#ff6b78;--i:#6ee0ff;--g:#d86bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.35 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
header{position:absolute;top:0;left:0;right:0;padding:8px 10px;background:linear-gradient(#07080cf5,#07080c00)}
header h1{margin:0;font-size:12px;letter-spacing:.05em}
header p{margin:2px 0 0;color:var(--dim);font-size:10px}
.layers{position:absolute;top:48px;left:8px;display:flex;flex-wrap:wrap;gap:4px}
.layers button,.bar button,.rail button{border:1px solid var(--line);background:#0c1118;color:var(--ink);padding:6px 8px;font-size:11px}
.layers button.on{background:#1a2838;border-color:#6ee0ff;color:#6ee0ff}
.rail{position:absolute;left:8px;right:8px;bottom:52px;display:flex;gap:3px}
.rail button{flex:1;min-width:0;padding:6px 2px;font-size:9px;color:var(--dim)}
.rail button.on{background:#6ee0ff;color:#061018;border-color:#6ee0ff}
.bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.bar input{flex:1}
aside{position:absolute;top:48px;right:8px;width:min(340px,46vw);max-height:calc(100% - 118px);overflow:auto;background:#0b1018f0;border:1px solid var(--line);padding:8px 10px}
aside h2{margin:0 0 4px;font-size:13px}
.stamp{display:inline-block;margin:0 3px 6px 0;padding:0 5px;border:1px solid currentColor;font-size:10px}
.H{color:var(--h)}.X{color:var(--x)}.I{color:var(--i)}.G{color:var(--g)}
dt{color:var(--dim);font-size:9px;text-transform:uppercase;margin-top:7px}
dd{margin:1px 0 0}
.port{font-family:ui-monospace,monospace;font-size:10px;color:#c9d7ea}
@media(max-width:820px){
  aside{left:8px;right:8px;width:auto;top:auto;bottom:100px;max-height:32vh}
  header p{display:none}
}
</style>
</head>

const LAYERS = {pieces:true, wires:true, knobs:false, acts:false};
let stage=0, playing=true, speed=1, acc=0, selected='C';
let yaw=-0.72, pitch=0.32, dist=13.2;
const look=[3.5,0.15,0];
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1, pointers=new Map();

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

  `<button type="button" data-k="${k}" class="${LAYERS[k]?'on':''}">${k}</button>`).join('');
document.getElementById('layers').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  LAYERS[b.dataset.k]=!LAYERS[b.dataset.k];
  b.classList.toggle('on', LAYERS[b.dataset.k]);
};

  if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}
  if(e.code==='ArrowRight'){stage=(stage+1)%8;acc=0;playing=false;document.getElementById('play').textContent='play';card();}
  if(e.code==='ArrowLeft'){stage=(stage+7)%8;acc=0;playing=false;document.getElementById('play').textContent='play';card();}
  if(e.code==='KeyR') document.getElementById('reset').click();
});

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',e=>{
  if(pointers.size===1){
    const hit=pick(e.clientX,e.clientY);
    if(hit){selected=hit; card();}
  }
  pointers.delete(e.pointerId);
});
canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
canvas.addEventListener('pointermove',e=>{
  const prev=pointers.get(e.pointerId); if(!prev) return;
  if(pointers.size===1){
    yaw+=(e.clientX-prev.x)*0.01;
    pitch=clamp(pitch+(e.clientY-prev.y)*0.01,-1.2,1.2);
  } else if(pointers.size===2){
    const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y);
    const d1=Math.hypot(e.clientX-other.x,e.clientY-other.y);
    if(d0>8) dist=clamp(dist*(d0/d1),6.5,24);
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+(e.deltaY>0?0.6:-0.6),6.5,24);},{passive:false});

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function live(id){return (PIECES[id].live||[]).includes(stage);}
function cam(){
  const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);
  return {pos:[look[0]+dist*cp*sy, look[1]+dist*sp, look[2]+dist*cp*cy],
          right:[cy,0,-sy], up:[-sy*sp,cp,-cy*sp]};
}
function proj(p){
  const c=cam();
  const vx=p[0]-c.pos[0],vy=p[1]-c.pos[1],vz=p[2]-c.pos[2];
  const f=[look[0]-c.pos[0],look[1]-c.pos[1],look[2]-c.pos[2]];
  const fl=Math.hypot(...f)||1; f[0]/=fl;f[1]/=fl;f[2]/=fl;
  const z=vx*f[0]+vy*f[1]+vz*f[2];
  const x=vx*c.right[0]+vy*c.right[1]+vz*c.right[2];
  const y=vx*c.up[0]+vy*c.up[1]+vz*c.up[2];
  const s=(H*0.68)/Math.max(0.55,z);
  return [W*0.38+x*s, H*0.42-y*s, z];
}
function pick(mx,my){
  let best=null,bd=22;
  for(const n of Object.values(PIECES)){
    const q=proj(n.p); if(q[2]<0.35) continue;
    const d=Math.hypot(q[0]-mx,q[1]-my);
    if(d<bd){bd=d;best=n.id;}
  }
  return best;
}
function col(st){ if(st.includes('G'))return '#d86bff'; if(st.includes('X'))return '#ff6b78'; if(st.includes('I'))return '#6ee0ff'; return '#e8b86d'; }
function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

function tokens(){
  const u=acc, P=PIECES;
  if(stage===0) return [
    {p:lerp3(P.R.p,P.I.p,Math.min(1,u*2))},
    {p:u<0.5?P.I.p:lerp3(P.I.p,P.RIC.p,(u-0.5)*2),twin:1},
    {p:u<0.5?P.I.p:lerp3(P.I.p,P.PFC.p,(u-0.5)*2),twin:1}
  ];
  if(stage===1) return [{p:P.RIC.p,twin:1},{p:P.PFC.p,twin:1}];
  const map={2:[['RIC','C'],['PFC','C'],['C','L']],3:[['L','M']],4:[['M','E']],
             5:[['L','ISL'],['M','ISL'],['E','ISL']],6:[['ISL','B'],['M','B'],['E','B']],
             7:[['B','R'],['ISL','PFC']]};
  return (map[stage]||[]).map(([a,b])=>({p:lerp3(P[a].p,P[b].p,u),twin:a==='RIC'||a==='PFC'||b==='PFC'}));
}

function box(){
  const corners=[[0.3,-1.7,-1.3],[6.2,-1.7,-1.3],[6.2,1.85,-1.3],[0.3,1.85,-1.3],
                 [0.3,-1.7,1.35],[6.2,-1.7,1.35],[6.2,1.85,1.35],[0.3,1.85,1.35]];
  const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  ctx.strokeStyle='#243044'; ctx.lineWidth=1;
  for(const [i,j] of edges){
    const A=proj(corners[i]), B=proj(corners[j]);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
  const lab=proj([3.2,1.95,-1.3]);
  ctx.fillStyle='#5d6b82'; ctx.font='10px ui-sans-serif';
  ctx.fillText('HOUSING · only structure crosses · meaning stays in the box', lab[0]-90, lab[1]);
}

function frame(now){
  if(!frame.t) frame.t=now;
  const dt=Math.min(0.05,(now-frame.t)/1000); frame.t=now;
  if(playing){ acc+=dt*0.5*speed; if(acc>=1){acc=0;stage=(stage+1)%8;card();} }
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.38,H*0.42,20,W*0.38,H*0.42,Math.max(W,H));
  g.addColorStop(0,'#121a2b'); g.addColorStop(1,'#07080c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  box();
  if(LAYERS.wires){
    for(const e of EDGES){
      const on=e.s.includes(stage) || (live(e.a)&&live(e.b));
      const A=proj(PIECES[e.a].p), B=proj(PIECES[e.b].p);
      ctx.strokeStyle=on?'#e8b86dcc':'#2a334866';
      ctx.lineWidth=on?2:1;
      ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
      if(on){
        const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
        ctx.fillStyle='#9aacc4'; ctx.font='9px ui-sans-serif';
        ctx.fillText(e.flow, mx+4, my-4);
      }
    }
  }
  if(LAYERS.knobs){
    for(const k of PARAMS){
      const q=proj(k.p);
      ctx.fillStyle='#6ee0ff'; ctx.beginPath(); ctx.arc(q[0],q[1],4,0,6.3); ctx.fill();
      ctx.fillStyle='#9ad7ff'; ctx.font='10px ui-sans-serif';
      ctx.fillText(k.id+' '+k.name, q[0]+7, q[1]-6);
    }
  }
  if(LAYERS.acts){
    for(const a of ACTS){
      const q=proj(a.p);
      ctx.strokeStyle='#e8b86d'; ctx.strokeRect(q[0]-6,q[1]-6,12,12);
      ctx.fillStyle='#e8b86d'; ctx.font='10px ui-sans-serif';
      ctx.fillText(a.name, q[0]+8, q[1]);
    }
  }
  if(LAYERS.pieces){
    for(const tok of tokens()){
      const q=proj(tok.p);
      ctx.fillStyle=tok.twin?'#6ee0ff':'#fff';
      ctx.beginPath(); ctx.arc(q[0],q[1],4.5,0,6.3); ctx.fill();
    }
    const ordered=Object.values(PIECES).sort((a,b)=>proj(b.p)[2]-proj(a.p)[2]);
    for(const n of ordered){
      const q=proj(n.p); if(q[2]<0.3) continue;
      const on=live(n.id)||n.id==='GAP';
      const sel=n.id===selected;
      ctx.globalAlpha=on?1:0.25;
      ctx.beginPath(); ctx.arc(q[0],q[1],sel?10:7,0,6.3);
      ctx.fillStyle=col(n.stamp); ctx.fill();
      ctx.strokeStyle='#fff9'; ctx.lineWidth=sel?2:0.7; ctx.stroke();
      ctx.fillStyle='#eef6ff'; ctx.font=(sel?'12px':'10px')+' ui-sans-serif';
      ctx.fillText(n.id, q[0]+10, q[1]-8);
      ctx.globalAlpha=1;
    }
  }
  document.getElementById('phase').textContent=STAGES[stage].name;
  [...document.querySelectorAll('#rail button')].forEach((b,i)=>b.classList.toggle('on',i===stage));
  requestAnimationFrame(frame);
}

function card(){
  const n=PIECES[selected], s=STAGES[stage];
  const act=ACTS[Math.min(stage,5)];
  document.getElementById('card').innerHTML=
    `<h2>${n.name}</h2>`+
    n.stamp.map(t=>`<span class="stamp ${t==='G'?'G':t}">${t==='G'?'[GAP]':'['+t+']'}</span>`).join('')+
    `<dl>
      <dt>Kind</dt><dd>${n.kind}</dd>
      <dt>Purpose</dt><dd>${n.purpose}</dd>
      <dt>Inputs</dt><dd class="port">${n.inputs}</dd>
      <dt>Outputs</dt><dd class="port">${n.outputs}</dd>
      <dt>Preconditions</dt><dd>${n.pre}</dd>
      <dt>Effects</dt><dd>${n.effects}</dd>
      <dt>Invariants</dt><dd>${n.inv}</dd>
      <dt>Failure</dt><dd>${n.fail}</dd>
      <dt>Boundary & coupling</dt><dd>${n.couple}</dd>
      <dt>Implementation</dt><dd>${n.impl}</dd>
      <dt>Metaphor</dt><dd>${n.meta}</dd>
      <dt>Source language</dt><dd>${n.quote}</dd>
      <dt>Hands</dt><dd>${n.hands}</dd>
      <dt>Clock now</dt><dd><b>${s.name}</b> — ${s.text}</dd>
      <dt>Act rhyme</dt><dd>${act.name}: ${act.q} → ${act.out}</dd>
    </dl>`;
}
card();
requestAnimationFrame(frame);
</script>
</body>
</html>
