<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HCC-A systems projection — laceArc Layer III</title>
<style>
  :root { --bg:#07080d; --ink:#d7e4ff; --dim:#7e8aa8; --h:#e8b86d; --x:#ff5d6c; --i:#6ee0ff; --g:#d86bff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { position:fixed; top:0; left:0; right:0; z-index:2; padding:10px 14px; background:linear-gradient(#07080dee,#07080d00); }
  header h1 { margin:0; font-size:14px; letter-spacing:.04em; }
  header p { margin:2px 0 0; color:var(--dim); font-size:12px; }
  #c { display:block; width:100%; height:100%; }
  aside { position:fixed; right:10px; top:72px; width:min(340px, 42vw); max-height:calc(100% - 90px); overflow:auto; background:#0c1018cc; border:1px solid #243049; padding:10px 12px; z-index:2; }
  aside h2 { margin:0 0 6px; font-size:13px; }
  aside .stamp { display:inline-block; margin-right:4px; padding:0 6px; border:1px solid currentColor; font-size:11px; }
  .H { color:var(--h); } .X { color:var(--x); } .I { color:var(--i); } .G { color:var(--g); }
  aside dl { margin:8px 0 0; }
  aside dt { color:var(--dim); font-size:11px; text-transform:uppercase; }
  aside dd { margin:0 0 8px; }
  .hint { position:fixed; left:12px; bottom:10px; color:var(--dim); font-size:11px; z-index:2; }
</style>
</head>
<body>
<header>
  <h1>HCC-A SYSTEMS PROJECTION</h1>
  <p>Layer III · follows docs/clock/hcc-a-systems-manifest.md · not Graphic D · POINTER emission [GAP]</p>
</header>
<canvas id="c"></canvas>
<aside id="card">
  <h2 id="title">click a node</h2>
  <div id="stamps"></div>
  <dl id="fields"></dl>
</aside>
<div class="hint">drag to orbit · scroll to zoom · token walks S0–S7 · oil stays in the box</div>
<script>
// Manifest-derived graph. Cubes/points are holder oil, not WORD rows.
const NODES = [
  {id:'R',   name:'H1 Reality',     p:[0,0,0],       stamp:['H'], kind:'Region',
   purpose:'Constraint-bearing world. Not directly accessible.', x:'not a Lace store'},
  {id:'I',   name:'H2 Interface',    p:[1.4,0.15,0.1], stamp:['H'], kind:'Interface',
   purpose:'Senses / nervous system / body state. R → raw signals.', x:'not Contract II ingest'},
  {id:'RIC', name:'H3 RIC',          p:[2.6,-1.1,0.5], stamp:['I','X'], kind:'Shaft',
   purpose:'Preserve structure and order in parallel with PFC.', x:'second log = [X]'},
  {id:'PFC', name:'H4 PFC',          p:[2.6,1.15,-0.55], stamp:['H','X'], kind:'Shaft',
   purpose:'Priors/templates before compile. ISL_n-1 loads this shaft.', x:'PFC-only ingest = [X]'},
  {id:'C',   name:'H5 Compiler',     p:[3.9,0.05,0.05], stamp:['X'], kind:'Mechanism',
   purpose:'Structure → story. Updates ledger oil.', x:'not a Core operator'},
  {id:'L',   name:'H6 Story Ledger', p:[5.1,-0.35,0.35], stamp:['X'], kind:'Store',
   purpose:'Add/merge/reindex/delete oil. Concrete+abstract+imagined+inferred.', x:'Rule Zero dies if on tape'},
  {id:'M',   name:'H7 Meaning',      p:[6.2,0.85,0.15], stamp:['X'], kind:'Mechanism',
   purpose:'Weights + transitions. Directive, not a label.', x:'not project-meaning'},
  {id:'E',   name:'H8 Emotion',      p:[6.2,1.7,-0.45], stamp:['H'], kind:'Mechanism',
   purpose:'Meaning-in-flight. Not transmissible.', x:'no E rows'},
  {id:'ISL', name:'H9 ISL',          p:[4.5,1.35,-1.45], stamp:['H','X'], kind:'Compressor',
   purpose:'Who am I. Priors for next PFC.', x:'not a star'},
  {id:'B',   name:'H10 Behavior',    p:[7.4,0.05,0.85], stamp:['H'], kind:'Output shaft',
   purpose:'Only observable output. Alters R. Freeze is still B.', x:'B is not POINTER'},
  {id:'GAP', name:'POINTER emission',p:[8.6,-1.6,-1.2], stamp:['G'], kind:'Open Hands gap',
   purpose:'When / arity / adjacency unanswered.', x:'this projection does not fill it'}
];
const EDGES = [
  ['R','I','H'], ['I','RIC','H'], ['I','PFC','H'],
  ['RIC','C','I'], ['PFC','C','X'], ['C','L','X'], ['L','M','X'],
  ['M','E','H'], ['L','ISL','H'], ['M','ISL','H'], ['E','ISL','H'],
  ['ISL','PFC','H'], ['ISL','B','H'], ['M','B','H'], ['E','B','H'],
  ['B','R','H']
];
const LOOP = ['R','I','RIC','C','L','M','E','ISL','B','R'];
const STAGES = ['S0 Intake','S1 Early prune','S2 Compile','S3 Meaning','S4 Emotion','S5 Identity','S6 Behavior','S7 Feedback'];

const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,dpr=1;
let yaw=0.55, pitch=0.42, zoom=42, cx=3.6, cy=0.1, cz=-0.1;
let dragging=false, lx=0, ly=0, t0=performance.now();
let selected='C';

function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  W = canvas.clientWidth = innerWidth;
  H = canvas.clientHeight = innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();
canvas.addEventListener('pointerdown', e => { dragging=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => dragging=false);
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  yaw += (e.clientX-lx)*0.008;
  pitch = Math.max(-1.2, Math.min(1.2, pitch+(e.clientY-ly)*0.008));
  lx=e.clientX; ly=e.clientY;
});
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(18, Math.min(90, zoom*(e.deltaY>0?0.94:1.06))); }, {passive:false});
canvas.addEventListener('click', e => {
  const hit = pick(e.clientX, e.clientY);
  if(hit){ selected=hit; renderCard(); }
});

function rot(p){
  let [x,y,z] = [p[0]-cx, p[1]-cy, p[2]-cz];
  const cyw=Math.cos(yaw), syw=Math.sin(yaw);
  let x1=x*cyw - z*syw, z1=x*syw + z*cyw;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  let y2=y*cp - z1*sp, z2=y*sp + z1*cp;
  return [x1,y2,z2];
}
function proj(p){
  const [x,y,z]=rot(p);
  const f = zoom*18/(9+z);
  return [W*0.42 + x*f, H*0.52 - y*f, z];
}
function pick(mx,my){
  let best=null, bd=18;
  for(const n of NODES){
    const [x,y]=proj(n.p);
    const d=Math.hypot(x-mx,y-my);
    if(d<bd){ bd=d; best=n.id; }
  }
  return best;
}
function col(st){
  if(st.includes('G')) return '#d86bff';
  if(st.includes('X') && st.includes('I')) return '#9ad7ff';
  if(st.includes('X')) return '#ff5d6c';
  if(st.includes('I')) return '#6ee0ff';
  return '#e8b86d';
}
function lerp(a,b,t){ return a+(b-a)*t; }
function lerp3(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function tokenPos(now){
  const cycle=9000;
  const u=((now-t0)%cycle)/cycle;
  const seg=u*(LOOP.length-1);
  const i=Math.floor(seg);
  const t=seg-i;
  const a=byId[LOOP[i]].p, b=byId[LOOP[i+1]].p;
  return {p:lerp3(a,b,t), stage:STAGES[Math.min(i,STAGES.length-1)]};
}
function axes(){
  const o=[cx,cy,cz], s=2.2;
  const segs=[[ [o[0]-s,o[1],o[2]],[o[0]+s,o[1],o[2]],'#335' ],
              [ [o[0],o[1]-s,o[2]],[o[0],o[1]+s,o[2]],'#335' ],
              [ [o[0],o[1],o[2]-s],[o[0],o[1],o[2]+s],'#335' ]];
  ctx.lineWidth=1;
  for(const [a,b,c] of segs){
    const A=proj(a), B=proj(b);
    ctx.strokeStyle=c; ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.4,H*0.5,20,W*0.4,H*0.5,Math.max(W,H)*0.7);
  g.addColorStop(0,'#10182a'); g.addColorStop(1,'#07080d');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  axes();
  for(const [a,b,st] of EDGES){
    const A=proj(byId[a].p), B=proj(byId[b].p);
    ctx.strokeStyle = st==='X' ? '#ff5d6c55' : st==='I' ? '#6ee0ff55' : '#e8b86d44';
    ctx.lineWidth = (a===selected||b===selected)?2:1;
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
  const tok=tokenPos(performance.now());
  const T=proj(tok.p);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(T[0],T[1],4.5,0,6.3); ctx.fill();
  ctx.fillStyle='#9ab'; ctx.font='11px ui-sans-serif'; ctx.fillText(tok.stage, T[0]+8, T[1]-8);
  const order=[...NODES].sort((a,b)=>rot(a.p)[2]-rot(b.p)[2]);
  for(const n of order){
    const [x,y]=proj(n.p);
    const on=n.id===selected;
    ctx.beginPath(); ctx.arc(x,y,on?9:6,0,6.3);
    ctx.fillStyle=col(n.stamp);
    ctx.globalAlpha=on?1:0.92; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='#fff8'; ctx.lineWidth=on?2:0.6; ctx.stroke();
    ctx.fillStyle='#eef6ff'; ctx.font=(on?'13px':'11px')+' ui-sans-serif';
    ctx.fillText(n.id, x+10, y-8);
  }
  requestAnimationFrame(draw);
}
function renderCard(){
  const n=byId[selected];
  document.getElementById('title').textContent=n.name;
  document.getElementById('stamps').innerHTML=n.stamp.map(s=>{
    const cls=s==='G'?'G':s;
    const lab=s==='G'?'[GAP]':`[${s}]`;
    return `<span class="stamp ${cls}">${lab}</span>`;
  }).join('');
  document.getElementById('fields').innerHTML=
    `<dt>Kind</dt><dd>${n.kind}</dd><dt>Purpose</dt><dd>${n.purpose}</dd><dt>On Graphic D</dt><dd>${n.x}</dd>`;
}
renderCard(); draw();
</script>
</body>
</html>
