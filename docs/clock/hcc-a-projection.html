<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>HCC-A systems manifest projection</title>
<style>
:root{
  --bg:#07080c;--ink:#e8eef8;--dim:#8b97b0;--line:#2a3348;
  --h:#e8b86d;--x:#ff6b78;--i:#6ee0ff;--g:#d86bff;
  --dock:calc(92px + env(safe-area-inset-bottom));
  --head:calc(44px + env(safe-area-inset-top));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none}
.hud .hit{pointer-events:auto}
header.hit{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#07080cf8 70%,#07080c00)}
header h1{margin:0;font-size:12px;letter-spacing:.06em}
header p{margin:2px 0 0;color:var(--dim);font-size:11px}
.layers.hit{position:absolute;top:var(--head);left:8px;display:flex;gap:6px;flex-wrap:wrap}
button, .chip{
  min-height:40px;border:1px solid var(--line);background:#0c1118ee;color:var(--ink);
  padding:0 12px;font-size:12px;border-radius:8px
}
.layers button.on,.tabs button.on,.rail button.on{background:#6ee0ff;color:#061018;border-color:#6ee0ff}
.dock.hit{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#07080cf2;border-top:1px solid var(--line)}
.rail{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.rail button{flex:0 0 auto}
.bar{display:flex;gap:8px;align-items:center}
.bar button{min-width:44px}
.bar input{flex:1;height:32px}
#phase{color:var(--dim);font-size:12px;white-space:nowrap}
aside.hit{position:absolute;right:8px;top:var(--head);width:min(360px,42vw);max-height:calc(100% - var(--head) - var(--dock) - 12px);display:flex;flex-direction:column;background:#0b1018f4;border:1px solid var(--line);border-radius:10px}
aside.hidden{display:none}
.card-top{display:flex;align-items:center;gap:8px;padding:8px 8px 0}
.card-top h2{margin:0;flex:1;font-size:14px}
.card-top button{min-height:36px;padding:0 10px}
.tabs{display:flex;gap:4px;padding:8px}
.tabs button{flex:1;min-height:36px;padding:0}
.card-body{overflow:auto;padding:0 12px 12px;flex:1}
.stamp{display:inline-block;margin:0 4px 6px 0;padding:1px 6px;border:1px solid currentColor;font-size:11px}
.H{color:var(--h)}.X{color:var(--x)}.I{color:var(--i)}.G{color:var(--g)}
dt{color:var(--dim);font-size:10px;text-transform:uppercase;margin-top:8px}
dd{margin:2px 0 0}
.port{font-family:ui-monospace,monospace;font-size:12px;color:#c9d7ea}
#peek{position:absolute;right:8px;top:var(--head);display:none}
aside.hidden+#peek, body.card-closed #peek{display:block}
@media(max-width:820px){
  header p{display:none}
  aside.hit{left:8px;right:8px;width:auto;top:auto;bottom:var(--dock);max-height:38vh}
  .layers.hit{max-width:calc(100% - 16px)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <header class="hit">
    <h1>HCC-A SYSTEMS MANIFEST · LAYER III</h1>
    <p>Housing = driver. Time = S0–S7. Oil ≠ Graphic D. Emission [GAP].</p>
  </header>
  <div class="layers hit" id="layers"></div>
  <aside class="hit" id="card"></aside>
  <button type="button" class="hit" id="peek" style="display:none">card</button>
  <div class="dock hit">
    <div class="rail" id="rail"></div>
    <div class="bar">
      <button type="button" id="prev" aria-label="previous stage">‹</button>
      <button type="button" id="play">pause</button>
      <button type="button" id="next" aria-label="next stage">›</button>
      <button type="button" id="reset">cam</button>
      <input id="spd" type="range" min="0.25" max="2.5" step="0.25" value="1" aria-label="speed"/>
      <span id="phase"></span>
    </div>
  </div>
</div>
<script>
const MANIFEST_URL = new URL('hcc-a-systems-manifest.md', location.href).href;
const LAYOUT = {
  R:[0,0,0], I:[1.15,0.2,0], RIC:[2.2,-1.15,-0.85], PFC:[2.2,1.2,0.9],
  C:[3.35,0.05,0], L:[4.4,-0.4,0.2], M:[5.35,0.85,0.1], E:[5.9,1.55,-0.4],
  ISL:[4.85,0.75,1.05], B:[6.7,0.05,0.15], H10b:[7.25,-0.55,0.55],
  GAP:[7.55,-1.55,-1.15]
};
const FMAP = {
  'Kind':'kind','Purpose':'purpose','Inputs':'inputs','Outputs':'outputs',
  'Preconditions':'pre','Effects':'effects','Invariants':'inv',
  'Failure modes':'fail','Failure modes / breakdown conditions':'fail',
  'Boundary & Coupling':'couple','Implementation implications':'impl',
  'Metaphor / diagnostic role':'meta','Key source language':'quote','Hands':'hands'
};

function parseManifest(md){
  const pieces={}, stages=[], params=[], acts=[], edges=[];
  const chunks = md.split(/^### /m).slice(1);
  for(const chunk of chunks){
    const lines = chunk.split('\n');
    const title = lines[0].trim();
    const body = lines.slice(1).join('\n');
    if(/^SM\b/.test(title)){
      for(const ln of body.split('\n')){
        const m = ln.match(/S(\d)\s+[—-]\s+(.+)/);
        if(m) stages.push({id:+m[1], name:'S'+m[1], text:m[2].replace(/\s+/g,' ').trim()});
      }
      continue;
    }
    if(/^P\b/.test(title)){
      for(const ln of body.split('\n')){
        const m = ln.match(/\*\*(P\d)\s+([^*]+)\*\*\s+[—-]\s+(.+)/);
        if(m) params.push({id:m[1], name:m[2].trim(), text:m[3].trim(), p:LAYOUT[m[1]] || [2.2,2.1,0]});
      }
      continue;
    }
    if(/^Acts\b/.test(title)){
      for(const ln of body.split('\n')){
        const m = ln.match(/\*\*([IVX]+)\s+([^*]+)\*\*\s+[—-]\s+(.+)/);
        if(m) acts.push({id:m[1], name:'Act '+m[1]+' '+m[2].trim(), q:m[3].trim(), p:[acts.length*1.1, -2.3, 0]});
      }
      continue;
    }
    if(/^(H11|SM →|System invariants)\b/.test(title)) continue;
    const idm = title.match(/\(([A-Za-z0-9]+)\)\s*$/) || title.match(/^(H10b|GAP|H\d+[a-z]?)\b/);
    let id = idm ? idm[1] : title.split(/[—-]/)[0].trim().replace(/\s+/g,'');
    if(id==='H10b' || /Feedback/.test(title) && /H10b/.test(title)) id='H10b';
    if(/POINTER emission|Hands silence/.test(title)) id='GAP';
    if(!/^H\d|^[A-Z]{1,4}$|^H10b$|^GAP$|^RIC$|^PFC$|^ISL$/.test(id) && !LAYOUT[id]){
      if(/^H\d/.test(title) || /\(R\)|\(I\)|\(C\)|\(L\)|\(M\)|\(E\)|\(B\)/.test(title) || /RIC|PFC|ISL|Feedback|POINTER/.test(title)){
        /* keep */
      } else continue;
    }
    const fields={};
    let cur=null, acc='';
    for(const ln of body.split('\n')){
      const fm = ln.match(/^- \*\*([^*]+):\*\*\s*(.*)$/);
      if(fm){
        if(cur) fields[cur]=acc.trim();
        cur=fm[1]; acc=fm[2];
      } else if(cur && ln.startsWith('  ')) acc += ' '+ln.trim();
      else if(cur && ln.startsWith('- ')) { fields[cur]=acc.trim(); cur=null; acc=''; }
    }
    if(cur) fields[cur]=acc.trim();
    const n={id, name:title.replace(/\s+/g,' '), p:LAYOUT[id]||hashP(id), live:[]};
    for(const [k,v] of Object.entries(fields)){
      const key=FMAP[k]; if(key) n[key]=v;
    }
    n.kind=n.kind||'Piece';
    n.stamp=stampsOf(n.hands||'', n.inv||'', n.fail||'', title+body.slice(0,400));
    pieces[id]=n;
  }
  const table = md.split('## Relational Mapping')[1] || '';
  for(const ln of table.split('\n')){
    const m = ln.match(/\|\s*([A-Za-z0-9]+)\s*→\s*([A-Za-z0-9]+)\s*\|\s*([^|]+)\|/);
    if(m && pieces[m[1]] && pieces[m[2]]) edges.push({a:m[1],b:m[2],flow:m[3].trim(),s:[]});
  }
  if(!stages.length){
    for(let i=0;i<8;i++) stages.push({id:i,name:'S'+i,text:''});
  }
  inferLive(pieces, stages);
  inferEdgeStages(edges, pieces);
  if(!pieces.GAP){
    pieces.GAP={id:'GAP',name:'POINTER emission [GAP]',kind:'Hands silence',stamp:['G'],
      purpose:'When / arity / adjacency unanswered.',p:LAYOUT.GAP,live:[],
      inputs:'None.',outputs:'None.',hands:'[GAP]'};
  }
  return {pieces, stages, params, acts, edges};
}
function hashP(id){
  let h=0; for(const c of id) h=c.charCodeAt(0)+((h<<5)-h);
  return [3.5+(h%10)*0.2, ((h>>3)%9-4)*0.25, ((h>>7)%7-3)*0.2];
}
function stampsOf(){
  const s=new Set();
  const blob=[...arguments].join(' ');
  if(/\[GAP\]/.test(blob)) s.add('G');
  if(/\[X\]|CONFLICT/.test(blob)) s.add('X');
  if(/\[I\]/.test(blob) && !/Contract II/.test(blob.split('[I]')[0].slice(-20))) s.add('I');
  if(/\[H\]/.test(blob) || s.size===0) s.add('H');
  if(s.has('G')) return ['G'];
  return [...s];
}
function inferLive(pieces, stages){
  for(const st of stages){
    const t=(st.text||'').toUpperCase();
    for(const id of Object.keys(pieces)){
      if(id==='GAP') continue;
      const token = id==='H10b' ? 'FEEDBACK' : id;
      if(new RegExp('\\b'+token+'\\b').test(t) || (id==='B' && /BEHAVIOR|\\bB\\b/.test(t)))
        pieces[id].live.push(st.id);
    }
  }
}
function inferEdgeStages(edges, pieces){
  for(const e of edges){
    const la=new Set(pieces[e.a].live||[]), lb=new Set(pieces[e.b].live||[]);
    e.s=[...la].filter(x=>lb.has(x));
    if(!e.s.length) e.s=[...la];
  }
}

const LAYERS={pieces:true,wires:true,knobs:false,acts:false};
let PIECES={}, STAGES=[], PARAMS=[], ACTS=[], EDGES=[];
let stage=0, playing=true, speed=1, acc=0, selected=null, tab='now', cardOpen=true;
let yaw=-0.72, pitch=0.32, dist=13.2;
const look=[3.5,0.15,0];
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1, pointers=new Map(), moved=false, ready=false, loadErr='';

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

async function boot(){
  try{
    const res=await fetch(MANIFEST_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status+' '+MANIFEST_URL);
    const md=await res.text();
    const M=parseManifest(md);
    PIECES=M.pieces; STAGES=M.stages; PARAMS=M.params; ACTS=M.acts; EDGES=M.edges;
    selected = PIECES.C ? 'C' : Object.keys(PIECES)[0];
    ready=true;
    wire(); card();
  }catch(err){
    loadErr=String(err);
    document.getElementById('card').innerHTML='<h2>manifest not loaded</h2><p>This page reads <code>hcc-a-systems-manifest.md</code> beside itself. Open via githack or a local server — file:// cannot fetch.</p><p class="port">'+loadErr+'</p>';
  }
}

function wire(){
  document.getElementById('layers').innerHTML=['pieces','wires','knobs','acts'].map(k=>
    `<button type="button" data-k="${k}" class="${LAYERS[k]?'on':''}">${k}</button>`).join('');
  document.getElementById('layers').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    LAYERS[b.dataset.k]=!LAYERS[b.dataset.k];
    b.classList.toggle('on', LAYERS[b.dataset.k]);
  };
  document.getElementById('rail').innerHTML=STAGES.map(s=>`<button type="button" data-s="${s.id}">S${s.id}</button>`).join('');
  document.getElementById('rail').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    setStage(+b.dataset.s,true);
  };
  document.getElementById('play').onclick=()=>{
    playing=!playing; document.getElementById('play').textContent=playing?'pause':'play';
  };
  document.getElementById('prev').onclick=()=>setStage(stage-1,true);
  document.getElementById('next').onclick=()=>setStage(stage+1,true);
  document.getElementById('reset').onclick=()=>{yaw=-0.72;pitch=0.32;dist=13.2};
  document.getElementById('spd').oninput=e=>speed=+e.target.value;
  document.getElementById('peek').onclick=()=>{cardOpen=true; card();};
  addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}
    if(e.code==='ArrowRight') setStage(stage+1,true);
    if(e.code==='ArrowLeft') setStage(stage-1,true);
    if(e.code==='KeyR') document.getElementById('reset').click();
    if(e.code==='KeyH'){cardOpen=!cardOpen; card();}
  });
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault(); moved=false;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup',e=>{
    if(pointers.size===1 && !moved){
      const hit=pick(e.clientX,e.clientY);
      if(hit){selected=hit; cardOpen=true; card();}
    }
    pointers.delete(e.pointerId);
  });
  canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
  canvas.addEventListener('pointermove',e=>{
    const prev=pointers.get(e.pointerId); if(!prev) return;
    if(Math.hypot(e.clientX-prev.x,e.clientY-prev.y)>6) moved=true;
    if(pointers.size===1){
      yaw+=(e.clientX-prev.x)*0.01;
      pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-prev.y)*0.01));
    } else if(pointers.size===2){
      const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1];
      const d0=Math.hypot(prev.x-other.x,prev.y-other.y);
      const d1=Math.hypot(e.clientX-other.x,e.clientY-other.y);
      if(d0>8) dist=Math.max(6.5,Math.min(24,dist*(d0/d1)));
    }
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  });
  canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6.5,Math.min(24,dist+(e.deltaY>0?0.6:-0.6)));},{passive:false});
}
function setStage(s, pause){
  const n=STAGES.length||8;
  stage=((s%n)+n)%n; acc=0;
  if(pause){ playing=false; document.getElementById('play').textContent='play'; }
  card();
}
function live(id){return (PIECES[id]&&PIECES[id].live||[]).includes(stage);}
function cam(){
  const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);
  return {pos:[look[0]+dist*cp*sy, look[1]+dist*sp, look[2]+dist*cp*cy],
          right:[cy,0,-sy], up:[-sy*sp,cp,-cy*sp]};
}
function proj(p){
  const c=cam();
  const vx=p[0]-c.pos[0],vy=p[1]-c.pos[1],vz=p[2]-c.pos[2];
  const f=[look[0]-c.pos[0],look[1]-c.pos[1],look[2]-c.pos[2]];
  const fl=Math.hypot(...f)||1; f[0]/=fl;f[1]/=fl;f[2]/=fl;
  const z=vx*f[0]+vy*f[1]+vz*f[2];
  const x=vx*c.right[0]+vy*c.right[1]+vz*c.right[2];
  const y=vx*c.up[0]+vy*c.up[1]+vz*c.up[2];
  const s=(H*0.68)/Math.max(0.55,z);
  return [W*0.46+x*s, H*0.36-y*s, z];
}
function pick(mx,my){
  let best=null,bd=22;
  for(const n of Object.values(PIECES)){
    const q=proj(n.p); if(q[2]<0.35) continue;
    const d=Math.hypot(q[0]-mx,q[1]-my);
    if(d<bd){bd=d;best=n.id;}
  }
  return best;
}
function col(st){ if((st||[]).includes('G'))return '#d86bff'; if((st||[]).includes('X'))return '#ff6b78'; if((st||[]).includes('I'))return '#6ee0ff'; return '#e8b86d'; }
function lerp3(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function tokens(){
  const liveE=EDGES.filter(e=>e.s.includes(stage) || (live(e.a)&&live(e.b)));
  if(!liveE.length) return [];
  return liveE.map(e=>({p:lerp3(PIECES[e.a].p, PIECES[e.b].p, acc), twin:e.a==='RIC'||e.a==='PFC'||e.b==='PFC'}));
}
function box(){
  const corners=[[0.3,-1.7,-1.3],[6.2,-1.7,-1.3],[6.2,1.85,-1.3],[0.3,1.85,-1.3],
                 [0.3,-1.7,1.35],[6.2,-1.7,1.35],[6.2,1.85,1.35],[0.3,1.85,1.35]];
  const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  ctx.strokeStyle='#243044'; ctx.lineWidth=1;
  for(const [i,j] of edges){
    const A=proj(corners[i]), B=proj(corners[j]);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
}
function frame(now){
  if(!frame.t) frame.t=now;
  const dt=Math.min(0.05,(now-frame.t)/1000); frame.t=now;
  if(ready && playing && STAGES.length){ acc+=dt*0.5*speed; if(acc>=1){acc=0;stage=(stage+1)%STAGES.length;card();} }
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.46,H*0.36,20,W*0.46,H*0.36,Math.max(W,H));
  g.addColorStop(0,'#121a2b'); g.addColorStop(1,'#07080c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(!ready){ requestAnimationFrame(frame); return; }
  box();
  if(LAYERS.wires){
    for(const e of EDGES){
      if(!PIECES[e.a]||!PIECES[e.b]) continue;
      const on=e.s.includes(stage)||(live(e.a)&&live(e.b));
      const A=proj(PIECES[e.a].p), B=proj(PIECES[e.b].p);
      ctx.strokeStyle=on?'#e8b86dcc':'#2a334866';
      ctx.lineWidth=on?2:1;
      ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
      if(on){
        const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
        ctx.fillStyle='#9aacc4'; ctx.font='9px ui-sans-serif';
        ctx.fillText(e.flow, mx+4, my-4);
      }
    }
  }
  if(LAYERS.knobs){
    PARAMS.forEach((k,i)=>{
      const p=k.p||[2.2+i*0.5,2.1,0];
      const q=proj(p);
      ctx.fillStyle='#6ee0ff'; ctx.beginPath(); ctx.arc(q[0],q[1],4,0,6.3); ctx.fill();
      ctx.fillStyle='#9ad7ff'; ctx.font='10px ui-sans-serif';
      ctx.fillText(k.id+' '+k.name, q[0]+7, q[1]-6);
    });
  }
  if(LAYERS.acts){
    ACTS.forEach(a=>{
      const q=proj(a.p);
      ctx.strokeStyle='#e8b86d'; ctx.strokeRect(q[0]-6,q[1]-6,12,12);
      ctx.fillStyle='#e8b86d'; ctx.font='10px ui-sans-serif';
      ctx.fillText(a.name, q[0]+8, q[1]);
    });
  }
  if(LAYERS.pieces){
    for(const tok of tokens()){
      const q=proj(tok.p);
      ctx.fillStyle=tok.twin?'#6ee0ff':'#fff';
      ctx.beginPath(); ctx.arc(q[0],q[1],4.5,0,6.3); ctx.fill();
    }
    const ordered=Object.values(PIECES).sort((a,b)=>proj(b.p)[2]-proj(a.p)[2]);
    for(const n of ordered){
      const q=proj(n.p); if(q[2]<0.3) continue;
      const on=live(n.id)||n.id==='GAP';
      const sel=n.id===selected;
      ctx.globalAlpha=on?1:0.25;
      ctx.beginPath(); ctx.arc(q[0],q[1],sel?10:7,0,6.3);
      ctx.fillStyle=col(n.stamp); ctx.fill();
      ctx.strokeStyle='#fff9'; ctx.lineWidth=sel?2:0.7; ctx.stroke();
      ctx.fillStyle='#eef6ff'; ctx.font=(sel?'12px':'10px')+' ui-sans-serif';
      ctx.fillText(n.id, q[0]+10, q[1]-8);
      ctx.globalAlpha=1;
    }
  }
  if(STAGES[stage]) document.getElementById('phase').textContent=STAGES[stage].name;
  [...document.querySelectorAll('#rail button')].forEach((b,i)=>b.classList.toggle('on',i===stage));
  requestAnimationFrame(frame);
}
function card(){
  const el=document.getElementById('card');
  const peek=document.getElementById('peek');
  if(!ready||!selected||!PIECES[selected]) return;
  const n=PIECES[selected], s=STAGES[stage]||{name:'',text:''};
  const act=ACTS[Math.min(stage, Math.max(0,ACTS.length-1))]||{name:'',q:'',out:''};
  if(!cardOpen){ el.classList.add('hidden'); peek.style.display='block'; return; }
  el.classList.remove('hidden'); peek.style.display='none';
  const body={
    now:`<dt>Clock</dt><dd><b>${s.name||('S'+stage)}</b> — ${s.text||''}</dd>
         <dt>Purpose</dt><dd>${n.purpose||''}</dd>
         <dt>Kind</dt><dd>${n.kind||''}</dd>`,
    ports:`<dt>Inputs</dt><dd class="port">${n.inputs||''}</dd>
           <dt>Outputs</dt><dd class="port">${n.outputs||''}</dd>
           <dt>Preconditions</dt><dd>${n.pre||''}</dd>
           <dt>Effects</dt><dd>${n.effects||''}</dd>`,
    law:`<dt>Invariants</dt><dd>${n.inv||''}</dd>
         <dt>Failure</dt><dd>${n.fail||''}</dd>
         <dt>Boundary & coupling</dt><dd>${n.couple||''}</dd>
         <dt>Implementation</dt><dd>${n.impl||''}</dd>`,
    hands:`<dt>Hands</dt><dd>${n.hands||''}</dd>
           <dt>Metaphor</dt><dd>${n.meta||''}</dd>
           <dt>Source language</dt><dd>${n.quote||''}</dd>`
  }[tab];
  el.innerHTML=
    `<div class="card-top"><h2>${n.name}</h2><button type="button" id="hide">hide</button></div>`+
    (n.stamp||[]).map(t=>`<span class="stamp ${t==='G'?'G':t}">${t==='G'?'[GAP]':'['+t+']'}</span>`).join('')+
    `<div class="tabs">${['now','ports','law','hands'].map(k=>
      `<button type="button" data-t="${k}" class="${k===tab?'on':''}">${k}</button>`).join('')}</div>`+
    `<div class="card-body"><dl>${body}</dl><p class="port">source: hcc-a-systems-manifest.md</p></div>`;
  el.querySelector('#hide').onclick=()=>{cardOpen=false; card();};
  el.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; card();});
}
boot();
requestAnimationFrame(frame);
</script>
</body>
</html>
